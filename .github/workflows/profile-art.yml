name: profile-art
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Карточка статистики
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&custom_title=статистика&bg_color=0a0a0a&title_color=d9d9d9&text_color=7a7a7a&icon_color=7a7a7a&border_color=262626&ring_color=d9d9d9&locale=ru
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Карточка языков
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&custom_title=языки&bg_color=0a0a0a&title_color=d9d9d9&text_color=7a7a7a&icon_color=7a7a7a&border_color=262626&ring_color=d9d9d9&locale=ru
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Сохранить карточки
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "обновить карточки" || exit 0
          git push
      - name: Змейка по графику активности
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?color_snake=#d9d9d9&color_dots=#161616,#2f2f2f,#5a5a5a,#8f8f8f,#d4d4d4
      - name: Выложить змейку в ветку output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
